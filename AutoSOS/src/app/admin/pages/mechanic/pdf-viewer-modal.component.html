<ion-header>
  <ion-toolbar>
    <ion-title>{{ documentName || 'PDF Document' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="downloadPdf()">
        <ion-icon name="download-outline"></ion-icon>
      </ion-button>
      <ion-button (click)="close()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="pdf-container">
    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading-state">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Loading PDF...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error" class="error-state">
      <ion-icon name="document-outline" size="large"></ion-icon>
      <h3>Unable to load PDF</h3>
      <p>The document could not be displayed. You can still download it.</p>
      <ion-button (click)="downloadPdf()" fill="outline">
        <ion-icon name="download-outline" slot="start"></ion-icon>
        Download PDF
      </ion-button>
    </div>

    <!-- PDF Viewer -->
    <div *ngIf="!isLoading && !error" class="pdf-viewer">
      <pdf-viewer 
        [src]="pdfSrc"
        [render-text]="true"
        [original-size]="false"
        [fit-to-page]="true"
        [zoom]="1"
        [zoom-scale]="'page-width'"
        [show-all]="true"
        [autoresize]="true"
        [stick-to-page]="true"
        (after-load-complete)="onPdfLoadComplete()"
        (error)="onPdfLoadError($event)"
        style="width: 100%; height: 100%;">
      </pdf-viewer>
    </div>
  </div>
</ion-content>
