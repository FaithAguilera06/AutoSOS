<ion-content [fullscreen]="true">
  <div class="registration-container">
    <div class="registration-form">
      <!-- Logo Section -->
      <div class="logo-section">
        <img src="assets/images/autoSOS logo.png" alt="AutoSOS Logo" class="logo">
      </div>
      
      <!-- Registration Form -->
      <div class="form-section">
        <h2>Client Registration</h2>
        <p>Create your account to access motorcycle assistance</p>
        
        <form #registrationForm="ngForm" (ngSubmit)="onSubmit()">
          <div class="input-group">
            <label>Full Name *</label>
            <ion-input type="text" placeholder="Enter your full name" name="fullName" [(ngModel)]="formData.fullName" required></ion-input>
          </div>
          
          <div class="input-group">
            <label>Contact Number *</label>
            <ion-input type="tel" placeholder="Enter your contact number" name="contactNumber" [(ngModel)]="formData.contactNumber" required></ion-input>
          </div>
          
          <div class="input-group">
            <label>Email *</label>
            <ion-input type="email" placeholder="Enter your email" name="email" [(ngModel)]="formData.email" required></ion-input>
          </div>
          
          <div class="input-group">
            <label>Password *</label>
            <ion-input [type]="passwordType" placeholder="Create a password" name="password" [(ngModel)]="formData.password" required>
              <ion-icon [name]="eyeIcon" slot="end" class="password-toggle" (click)="togglePasswordVisibility()"></ion-icon>
            </ion-input>
          </div>
          
          <div class="input-group">
            <label>Confirm Password *</label>
            <ion-input [type]="confirmPasswordType" placeholder="Confirm your password" name="confirmPassword" [(ngModel)]="formData.confirmPassword" required>
              <ion-icon [name]="confirmEyeIcon" slot="end" class="password-toggle" (click)="toggleConfirmPasswordVisibility()"></ion-icon>
            </ion-input>
          </div>
          
          <ion-button expand="block" class="register-button" type="submit" [disabled]="!registrationForm.valid || isLoading">
            <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
            <span *ngIf="!isLoading">Create Account</span>
          </ion-button>
        </form>
      </div>
      
      <!-- Login Link -->
      <div class="login-link">
        <p>Already have an account? <a routerLink="/login">Log in</a></p>
      </div>
      
      <!-- Back Link -->
      <div class="back-link">
        <a routerLink="/role-selection">← Back to Role Selection</a>
      </div>
    </div>
  </div>
</ion-content>
