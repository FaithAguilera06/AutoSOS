<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Request Map</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
  <style>
    .service-map-container {
      height: 300px;
      position: relative;
      background: #f0f0f0;
      border-radius: 12px;
      overflow: hidden;
    }

    .service-map {
      width: 100%;
      height: 100%;
    }

    .map-loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .loading-content {
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .map-info-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .route-info {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 8px 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(10px);
      display: flex;
      gap: 15px;
    }

    .distance-info, .eta-info {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #333;
    }

    .map-controls {
      display: flex;
      gap: 5px;
    }

    .map-btn {
      background: rgba(255, 255, 255, 0.9);
      border: none;
      color: #333;
      padding: 6px 10px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .map-btn:hover {
      background: white;
      transform: translateY(-1px);
    }

    .map-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="service-map-container">
    <div id="service-map" class="service-map"></div>
    
    <!-- Map Loading Overlay -->
    <div class="map-loading-overlay" id="loadingOverlay">
      <div class="loading-content">
        <div class="spinner"></div>
        <p style="margin: 10px 0 0 0; font-size: 0.9rem; color: #666;">Loading map...</p>
      </div>
    </div>
    
    <!-- Map Info Overlay -->
    <div class="map-info-overlay" id="mapInfo" style="display: none;">
      <div class="route-info">
        <div class="distance-info">
          <span>🧭</span>
          <span id="routeDistance">Calculating...</span>
        </div>
        <div class="eta-info">
          <span>⏱️</span>
          <span id="routeDuration">Calculating...</span>
        </div>
      </div>
      
      <!-- Map Controls -->
      <div class="map-controls">
        <button class="map-btn" onclick="centerOnMechanic()" id="centerMechanicBtn">
          📍 You
        </button>
        <button class="map-btn" onclick="centerOnClient()" id="centerClientBtn">
          👤 Client
        </button>
        <button class="map-btn" onclick="refreshRoute()" id="refreshBtn">
          🔄 Refresh
        </button>
      </div>
    </div>
  </div>

  <script>
    // Configuration
    const MAPBOX_TOKEN = 'pk.eyJ1IjoiYXV0b3NvczEyMyIsImEiOiJjbWdvNHJ0MDkxcjJtMm5va2lhNnB1YjR0In0.8hQ5bC4FlZKZFevZQvBzNg';
    
    // Global variables
    let map;
    let mapLoaded = false;
    let isLoadingRoute = false;
    let routeLoaded = false;
    let mechanicLocation = { lat: 14.6561, lng: 121.0307 }; // SM North EDSA
    let clientLocation = { lat: 14.5355, lng: 120.9821 }; // SM Mall of Asia

    // Initialize the map
    async function initServiceMap() {
      try {
        mapboxgl.accessToken = MAPBOX_TOKEN;

        // Create map
        map = new mapboxgl.Map({
          container: 'service-map',
          style: 'mapbox://styles/mapbox/streets-v12',
          center: [clientLocation.lng, clientLocation.lat],
          zoom: 13
        });

        map.on('load', () => {
          mapLoaded = true;
          document.getElementById('loadingOverlay').style.display = 'none';
          document.getElementById('mapInfo').style.display = 'flex';
          addMarkers();
          loadRoute();
        });

        // Add navigation controls
        map.addControl(new mapboxgl.NavigationControl(), 'top-right');

      } catch (error) {
        console.error('Error initializing service map:', error);
      }
    }

    function addMarkers() {
      // Add client marker
      new mapboxgl.Marker({ color: '#ff3b30' })
        .setLngLat([clientLocation.lng, clientLocation.lat])
        .setPopup(new mapboxgl.Popup().setHTML('<h4>Client Location</h4><p>Service Request</p>'))
        .addTo(map);

      // Add mechanic marker
      new mapboxgl.Marker({ color: '#0a7cff' })
        .setLngLat([mechanicLocation.lng, mechanicLocation.lat])
        .setPopup(new mapboxgl.Popup().setHTML('<h4>Your Location</h4><p>Mechanic Position</p>'))
        .addTo(map);
    }

    async function loadRoute() {
      if (!map || !clientLocation || !mechanicLocation) return;

      isLoadingRoute = true;
      document.getElementById('refreshBtn').disabled = true;

      try {
        const start = `${mechanicLocation.lng},${mechanicLocation.lat}`;
        const end = `${clientLocation.lng},${clientLocation.lat}`;

        const response = await fetch(
          `https://api.mapbox.com/directions/v5/mapbox/driving/${start};${end}?geometries=geojson&access_token=${MAPBOX_TOKEN}`
        );

        if (!response.ok) {
          throw new Error('Failed to get directions');
        }

        const data = await response.json();
        
        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          
          // Update route info
          document.getElementById('routeDistance').textContent = (route.distance / 1000).toFixed(1) + ' km';
          document.getElementById('routeDuration').textContent = Math.round(route.duration / 60) + ' min';

          // Remove existing route
          if (map.getLayer('route')) {
            map.removeLayer('route');
            map.removeSource('route');
          }

          // Add route to map
          map.addSource('route', {
            type: 'geojson',
            data: {
              type: 'Feature',
              geometry: route.geometry
            }
          });

          map.addLayer({
            id: 'route',
            type: 'line',
            source: 'route',
            layout: {
              'line-join': 'round',
              'line-cap': 'round'
            },
            paint: {
              'line-color': '#1f75fe',
              'line-width': 4,
              'line-opacity': 0.8
            }
          });

          // Fit map to route
          const bounds = new mapboxgl.LngLatBounds();
          route.geometry.coordinates.forEach((coord) => {
            bounds.extend(coord);
          });
          map.fitBounds(bounds, { padding: 30 });

          routeLoaded = true;
        }
      } catch (error) {
        console.error('Error loading route:', error);
      } finally {
        isLoadingRoute = false;
        document.getElementById('refreshBtn').disabled = false;
      }
    }

    function centerOnMechanic() {
      if (map && mechanicLocation) {
        map.flyTo({
          center: [mechanicLocation.lng, mechanicLocation.lat],
          zoom: 15
        });
      }
    }

    function centerOnClient() {
      if (map && clientLocation) {
        map.flyTo({
          center: [clientLocation.lng, clientLocation.lat],
          zoom: 15
        });
      }
    }

    function refreshRoute() {
      loadRoute();
    }

    // Initialize when page loads
    document.addEventListener('DOMContentLoaded', initServiceMap);
  </script>
</body>
</html>
